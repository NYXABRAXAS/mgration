<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d45">
  <meta name="description" content="Stage-wise APPX to OPTIM migration field reference for six Suryoday product branches.">
  <title>Suryoday LOS Migration Hub</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./workbench.css">
  <link rel="stylesheet" href="./new-car-comparison.css?v=2">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand-lockup">
      <div class="brand-mark">P</div>
      <div><div class="brand-name">PROHORIZON</div><div class="brand-caption">MIGRATION REFERENCE</div></div>
    </div>
    <div class="topbar-title"><span>SURYODAY BANK</span><span class="topbar-divider">/</span><span>APPX → OPTIM</span></div>
    <div class="topbar-meta"><span class="live-dot"></span> Product reference</div>
  </header>

  <main id="main">
    <nav id="workspace-nav" class="workspace-nav" aria-label="Migration workspace">
      <button type="button" data-view="dashboard" class="workspace-tab">Dashboard</button>
      <button type="button" data-view="products" class="workspace-tab">Products</button>
      <button type="button" data-view="comparison" class="workspace-tab">APPX vs OPTIM</button>
      <button type="button" data-view="newcar" class="workspace-tab">New Car comparison</button>
      <button type="button" data-view="screens" class="workspace-tab">Screen walkthrough</button>
      <button type="button" data-view="inventory" class="workspace-tab">APPX screen &amp; field index</button>
      <button type="button" data-view="tracker" class="workspace-tab">Gap tracker</button>
      <button type="button" data-view="evidence" class="workspace-tab">Evidence workspace</button>
    </nav>
    <div id="notice" class="source-notice" role="note"></div>
    <section id="dashboard-view" class="workbench-view" hidden></section>
    <section id="landing" class="landing"></section>
    <section id="product-view" class="product-view" hidden>
      <aside class="sidebar">
        <button id="back-to-products" class="back-link" type="button">← All products</button>
        <div id="product-sidebar-card"></div>
        <div class="sidebar-rule"></div>
        <div class="side-label">PRODUCT JOURNEY</div>
        <nav id="stage-nav" class="stage-nav" aria-label="Product journey stages"></nav>
        <div class="sidebar-foot"><span class="status-dot"></span><span>Stage order follows the portal routes and dynamic journey response.</span></div>
      </aside>
      <div class="content-column">
        <div class="content-toolbar">
          <div id="breadcrumbs" class="breadcrumbs"></div>
          <label class="global-search-wrap"><span class="search-icon">⌕</span><input id="global-search" type="search" placeholder="Search this product’s fields" aria-label="Search this product’s fields"><kbd>⌘ K</kbd></label>
        </div>
        <div id="stage-content" class="stage-content"></div>
      </div>
    </section>
    <section id="comparison-view" class="workbench-view" hidden></section>
    <section id="newcar-view" class="workbench-view" hidden></section>
    <section id="screens-view" class="workbench-view" hidden></section>
    <section id="inventory-view" class="workbench-view" hidden></section>
    <section id="tracker-view" class="workbench-view" hidden></section>
    <section id="evidence-view" class="workbench-view" hidden></section>
  </main>
  <footer class="site-footer"><span>Suryoday APPX → OPTIM Migration Hub</span><span>Product and journey reference</span></footer>

  <script src="./app.js" defer></script>
  <script src="./workbench.js" defer></script>
  <script src="./new-car-stage-view.js?v=5" defer></script>
</body>
</html>
